[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Project_Chronos"
version = "0.3.1a2"
description = "Storage-aware recurrent-depth MoE: lookahead expert prefetch, SSD-lazy experts, hybrid MLA/SWA attention, self-speculative decoding"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["llm", "moe", "inference", "lookahead-routing", "hybrid-attention", "recurrent-depth", "speculative-decoding", "mlx", "edge-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.6.0",  # transformers 5 disables its PyTorch backend below 2.6
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "safetensors>=0.4.0",
    "optuna>=3.6.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "tokenizers>=0.19.0",
    "tqdm>=4.66.0",
    "gradio>=5.0,<6",  # Web UI tested on 5.35 (gr.Timer, LinePlot color_map)
]

[project.optional-dependencies]
cluster = ["python-louvain>=0.16", "networkx>=3.0"]
mlx     = ["mlx>=0.32.4"]  # gather_mm sparse MoE: 0.31.x is broken on M5 GPUs
serve   = ["fastapi==0.115.9", "uvicorn==0.34.3"]  # chronos serve / chronos monitor
dev     = ["pytest>=7.0", "black>=24.0", "ruff>=0.4.0", "httpx>=0.27", "fastapi==0.115.9", "uvicorn==0.34.3"]

[project.urls]
Homepage = "https://github.com/FonaTech/Project_Chronos"
Issues = "https://github.com/FonaTech/Project_Chronos/issues"

[project.scripts]
chronos       = "chronos.cli:main"
chronos-ui    = "chronos.webui.server:main"
chronos-train = "train_chronos:main"
chronos-eval  = "chronos.eval.io_profiler:main"
chronos-bench = "chronos.eval.benchmark:main"
chronos-export = "chronos.io.cluster_layout:main"

[tool.setuptools]
py-modules = [
    "train_chronos",
    "train_chronos_sft",
    "train_chronos_dpo",
    "train_chronos_orpo",
    "train_chronos_grpo",
    "train_chronos_distill",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["chronos*", "ui*"]

[tool.setuptools.package-data]
ui = ["event_contract.js", "presets_v3.json"]
"chronos.monitor" = ["static/*.html", "static/*.js", "static/*.css"]
"chronos.webui" = ["static/*.html", "static/*.js", "static/*.css", "static/*.svg", "i18n/*.json"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# CI uses Ruff as a lightweight build guard: syntax-level pycodestyle errors
# and undefined names. Formatting/import cleanup is intentionally left to
# dedicated formatter jobs so a missing optional UI dependency or legacy import
# ordering does not block smoke tests.
select = ["E9", "F821"]
