name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # CPU torch wheel; versions come from .github/ci-constraints.txt
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -c .github/ci-constraints.txt transformers datasets tokenizers safetensors optuna \
            psutil numpy tqdm pytest ruff fastapi uvicorn httpx

      - name: Lint
        run: |
          ruff check .

      - name: Unit tests
        run: |
          python -m pytest tests/ -v --tb=short
